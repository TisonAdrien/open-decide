[project]
name = "open-decide"
version = "0.1.0"
description = "No-code decision tree builder powered by fast, Jev-class decision models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Open Decide contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
ingest = [
    "pypdf>=5.0",
    "pillow>=10.4",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
]
tamev = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
]
openjev = [
    "openjev-ai>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_decide"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses File(...) / Form(...) as argument defaults by design.
"src/open_decide/api/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "torch",
    "transformers",
    "transformers.*",
    "wev",
    "pytesseract",
    "pdf2image",
    "pypdf",
    "PIL",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
